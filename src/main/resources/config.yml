# ===== RaskolCaravan =====
caravan:
  travel-seconds: 7200      # 2 часа реального времени
  cooldown-hours: 24        # КД между парой королевств
  profit-percent: 10.0      # 10% от общей суммы — прибыль на двоих
  guard-price: 10000.0      # цена одного стражника 50 ур.
  base-hp: 20.0             # базовое HP каравана
  hp-per-guard: 20.0        # +HP за каждого стражника
  offer-timeout-seconds: 600 # 10 минут на ответ по офферу

robbery:
  min-percent: 5.0          # мин % суммы грабителям
  max-percent: 35.0         # макс % суммы грабителям
  # остаток (100% - robbery%) возвращается в казны по пропорции вложений

town-account-prefix: "town-"
